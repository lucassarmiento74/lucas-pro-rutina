<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f19"><title>Lucas Pro V2</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>
*{box-sizing:border-box}body{margin:0;background:#0b0f19;color:#f1f5f9;font:14px system-ui,-apple-system,Arial;padding-bottom:90px}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:#0b0f19f5;border-bottom:1px solid #263247;padding:13px 15px}.top,.between{display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{font-size:23px;font-weight:900;letter-spacing:-.7px}.logo span,.blue{color:#60a5fa}.sub{font-size:10px;color:#94a3b8;letter-spacing:1px;font-weight:700}.tabs,.days{display:flex;gap:7px;overflow:auto;padding:12px 0 2px;scrollbar-width:none}.tabs button,.days button,.btn{border:1px solid #334155;background:#1e293b;color:#cbd5e1;border-radius:10px;padding:10px 12px;font-weight:700;white-space:nowrap}.tabs button.active,.days button.active,.btn.primary{background:#2563eb;color:white;border-color:#60a5fa}main{max-width:580px;margin:auto;padding:15px}.card{background:#172235;border:1px solid #334155;border-radius:15px;padding:15px;margin-bottom:12px}.card.done{border-color:#10b981}.muted{color:#94a3b8;font-size:12px;line-height:1.5}.hint{background:#302719;color:#fde68a;border:1px solid #7c5b2a;border-radius:12px;padding:12px;margin:12px 0;font-size:12px}h2{font-size:20px;margin:3px 0 8px}h3{font-size:15px;margin:0 0 6px}label{display:block;color:#a8b7ce;font-size:11px;margin:8px 0 3px;font-weight:700}input,select{background:#0b1220;border:1px solid #475569;border-radius:8px;color:white;padding:10px;width:100%;min-width:0}input:focus{outline:2px solid #2563eb}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0b1220;border-radius:10px;padding:10px;text-align:center}.stat b{font-size:19px;color:#93c5fd}.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.pill{color:#93c5fd;background:#0b1220;border-radius:7px;padding:6px 8px;white-space:nowrap;font-size:12px;font-weight:800}.btn.small{padding:7px 9px;font-size:12px}.row{display:flex;align-items:center;gap:8px}.check{width:25px;height:25px;accent-color:#10b981}.footer{position:fixed;bottom:0;left:0;right:0;background:#0f172aef;border-top:1px solid #334155;padding:10px 14px;display:flex;align-items:center;justify-content:center;gap:12px;z-index:4}.footer b{font-size:21px;min-width:62px;text-align:center}.footer button{background:#1e293b;border:1px solid #475569;color:white;border-radius:8px;padding:8px}.progress{height:8px;background:#334155;border-radius:9px;overflow:hidden;margin:7px 0}.progress i{display:block;height:100%;background:#3b82f6}.hidden{display:none}.right{text-align:right}small{color:#94a3b8}.meal{border-top:1px solid #334155;padding:12px 0}.meal:first-child{border-top:0}.spacer{height:8px}a{color:#93c5fd}@media(min-width:650px){main{padding:24px}}
</style></head><body><header><div class="top"><div><div class="sub">PLAN ESTÉTICO · BLOQUE V2 · 8 SEMANAS</div><div class="logo">LUCAS <span>PRO</span></div></div><button class="btn small" onclick="exportData()">↥ Backup</button></div><nav class="tabs" id="tabs"></nav></header><main id="app"></main><div class="footer"><small>DESCANSO</small><b id="clock">01:30</b><button onclick="setTimer(60)">1m</button><button onclick="setTimer(90)">1:30</button><button onclick="setTimer(120)">2m</button><button onclick="toggleTimer()" id="play">▶</button></div><script>
'use strict';
const days=['lun','mar','mie','jue','vie','sab','dom'],labels=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const ex=(name,sets,reps,desc)=>({name,sets,reps,desc});
const plan={
lun:{title:'Pecho superior + hombros + tríceps',duration:'60–70 min',alert:'Prioridad: pecho superior. Presses con 2–3 min de descanso.',exercises:[ex('Press inclinado mancuernas',3,'6–10','Banco 20–30°. Progresión de cargas.'),ex('Press unilateral máquina convergente',2,'8–12','Trayectoria ligeramente inclinada; si no hay máquina, press inclinado.'),ex('Aperturas polea baja hacia arriba',2,'12–15','Control y amplitud cómoda.'),ex('Elevaciones laterales polea unilateral',3,'12–20','Sin balanceo.'),ex('Elevaciones laterales sentado',2,'12–20','Controlar la bajada.'),ex('Extensión tríceps sobre cabeza',3,'10–15','Cuerda, codos estables.')]},
mar:{title:'Espalda + bíceps + abdomen',duration:'60–70 min',exercises:[ex('Dominadas pronas o asistidas',3,'6–10','Rango controlado.'),ex('Remo máquina pecho apoyado',3,'8–12','Evitar impulso lumbar.'),ex('Pullover con cuerda polea alta',2,'12–15','Brazos semirrígidos.'),ex('Remo unilateral en polea',2,'10–12','Tirar hacia la cadera.'),ex('Curl predicador en máquina',3,'8–12','Sin rebotes.'),ex('Curl martillo mancuernas',2,'10–15','Muñeca neutra.'),ex('Crunch abdominal polea',3,'10–15','Controlar movimiento.')]},
mie:{title:'Piernas',duration:'55–65 min',alert:'Dejar 2–3 repeticiones en reserva, especialmente las primeras 2 semanas, para recuperar antes del fútbol.',exercises:[ex('Sentadilla hack',3,'6–10','Profundidad cómoda.'),ex('Peso muerto rumano mancuernas',3,'8–10','Cadera atrás, espalda neutra.'),ex('Zancadas inversas',2,'10–12 por pierna','Control y equilibrio.'),ex('Curl femoral sentado',3,'10–15','Bajada lenta.'),ex('Extensión de cuádriceps',2,'12–15','Sin rebotes.'),ex('Elevaciones de gemelos',3,'12–20','Pausa arriba.')]},
jue:{title:'Torso · segundo estímulo pecho',duration:'55–65 min',exercises:[ex('Press inclinado Smith',3,'8–12','Banco 15–30°.'),ex('Jalón al pecho neutro',3,'8–12','Recorrido cómodo.'),ex('Press plano máquina convergente',2,'8–12','Técnica estable.'),ex('Remo sentado polea',3,'10–12','Sin impulso.'),ex('Aperturas inclinadas máquina/polea',2,'12–15','Tensión controlada.'),ex('Elevaciones laterales máquina',3,'12–20','Sin elevar hombros.'),ex('Reverse pec deck',2,'12–20','Deltoides posterior.')]},
vie:{title:'Fútbol · 1 hora',duration:'60 min · tarde',alert:'Sin gimnasio. Hidratación y carbohidratos antes/después del partido.',exercises:[ex('Partido de fútbol',1,'60 min','Calentamiento previo y recuperación.')]},
sab:{title:'Complementario · opcional',duration:'40–50 min',alert:'Si estás fatigado del fútbol, descansá. Esta sesión no es obligatoria.',exercises:[ex('Elevaciones laterales polea',2,'15–20','Ligero, controlado.'),ex('Curl bíceps barra EZ',3,'8–12','Sin balanceo.'),ex('Extensión tríceps polea',3,'10–15','Control de codos.'),ex('Pájaros mancuernas',2,'12–20','Deltoides posterior.'),ex('Elevaciones rodillas colgado',3,'10–15','Sin balanceo.')]},
dom:{title:'Descanso completo',duration:'Recuperación',alert:'Dormir bien, caminar si apetece y mantener proteína e hidratación.',exercises:[]}
};
const meals={
lun:[['Desayuno','2 huevos + 200 g claras + 70 g pan integral + banana'],['Postentreno','250 g skyr + 40 g avena + frutos rojos'],['Almuerzo','180 g pollo + 250 g arroz cocido + verduras + 10 g aceite oliva'],['Merienda','Sándwich integral + 80 g pavo + fruta'],['Cena','180 g merluza + 300 g patata + ensalada + 15 g aceite']],
mar:[['Desayuno','250 g skyr + 70 g avena + banana'],['Postentreno','Tostadas integrales + 100 g pavo'],['Almuerzo','180 g ternera magra + 250 g pasta cocida + verduras'],['Merienda','Yogur proteico + fruta + 25 g nueces'],['Cena','180 g pollo + 250 g patata + verduras']],
mie:[['Desayuno','80 g avena + 250 ml leche + banana + 2 huevos'],['Postentreno','Skyr + fruta'],['Almuerzo','180 g pollo + 300 g arroz cocido + verduras'],['Merienda','Bocadillo integral de atún'],['Cena','180 g pescado blanco + 300 g patata + ensalada']],
jue:[['Desayuno','2 huevos + 200 g claras + tostadas integrales'],['Postentreno','Yogur proteico + avena + fruta'],['Almuerzo','180 g pavo + 250 g pasta cocida + verduras'],['Merienda','Sándwich integral queso fresco y pavo'],['Cena','180 g salmón + 200 g arroz cocido + verduras']],
vie:[['Desayuno','250 g yogur proteico + 70 g avena + fruta'],['Almuerzo (3–4 h antes)','180 g pollo + 300 g arroz cocido + verduras cocidas'],['Prepartido (60–90 min)','Banana + tostadas con miel'],['Postpartido (si cena tarda)','Leche o yogur proteico + fruta'],['Cena','180–200 g pollo o pescado + 300 g patata + verduras']],
sab:[['Desayuno','Tostadas + 2 huevos + claras + fruta'],['Postentreno','Skyr + avena'],['Almuerzo','180 g pollo o ternera + 250 g arroz cocido + verduras'],['Merienda','Yogur proteico + fruta + frutos secos'],['Cena','180 g pescado + patata al horno + ensalada']],
dom:[['Desayuno','Tortilla 2 huevos + claras + pan integral'],['Almuerzo','Pollo al horno + patatas + ensalada'],['Merienda','Skyr + fruta + nueces'],['Cena','Pescado + arroz + verduras']]
};
const storage=(()=>{let ok=true;try{localStorage.setItem('__lp_test','1');localStorage.removeItem('__lp_test')}catch(e){ok=false}const mem={};return {ok,get(k){try{return ok?localStorage.getItem(k):mem[k]||null}catch(e){return null}},set(k,v){try{if(ok)localStorage.setItem(k,v);else mem[k]=v}catch(e){alert('No se pudo guardar. Exportá una copia de seguridad.')}}}})();
const KEY='lucas_pro_v2_data',todayISO=()=>{const d=new Date(),offset=d.getTimezoneOffset();return new Date(d.getTime()-offset*60000).toISOString().slice(0,10)};
let state;try{state=JSON.parse(storage.get(KEY)||'{}')}catch(e){state={}};if(!state||typeof state!=='object')state={};
state.logs ||= {};state.food ||= {};state.measures ||= [];state.goals ||= {kcal:2450,protein:170,fat:70,carbs:285};
let section='entreno',day=days[(new Date().getDay()+6)%7],date=todayISO();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){storage.set(KEY,JSON.stringify(state))}
function nav(s){section=s;render()}
function setDay(d){day=d;render()}
function setDate(v){if(v){date=v;render()}}
function tabs(){document.getElementById('tabs').innerHTML=[['entreno','🏋️ Entreno'],['nutri','🥗 Nutrición'],['progreso','📈 Progreso'],['ajustes','⚙️ Ajustes']].map(([k,v])=>'<button class="'+(section===k?'active':'')+'" onclick="nav(\''+k+'\')">'+v+'</button>').join('')}
function dayNav(){return '<div class="days">'+days.map((d,i)=>'<button class="'+(day===d?'active':'')+'" onclick="setDay(\''+d+'\')">'+labels[i].slice(0,3).toUpperCase()+'</button>').join('')+'</div>'}
function workout(){const p=plan[day];let out=dayNav()+'<div class="card"><div class="sub">'+labels[days.indexOf(day)].toUpperCase()+'</div><h2>'+p.title+'</h2><div class="muted">⏱ '+p.duration+'</div></div>';if(p.alert)out+='<div class="hint">'+p.alert+'</div>';out+='<div class="card"><label>Fecha de sesión (para guardar historial)</label><input type="date" value="'+date+'" onchange="setDate(this.value)"></div>';const key=date+'_'+day;state.logs[key] ||= {};p.exercises.forEach((e,i)=>{const id=day+'_'+i,log=state.logs[key][id]||{},prior=findPrevious(day,id,date);out+='<div class="card '+(log.done?'done':'')+'"><div class="exhead"><div><h3>'+esc(e.name)+'</h3><div class="muted">'+esc(e.desc)+'</div></div><div class="pill">'+e.sets+' × '+e.reps+'</div></div><div class="grid2"><div><label>Peso (kg)</label><input type="number" step=".5" min="0" value="'+esc(log.weight||'')+'" onchange="logEx(\''+id+'\',\'weight\',this.value)"></div><div><label>Reps (ej. 10,10,8)</label><input value="'+esc(log.reps||'')+'" onchange="logEx(\''+id+'\',\'reps\',this.value)"></div></div><div class="between" style="margin-top:10px"><small>'+(prior?'Anterior: '+esc(prior.weight||'–')+' kg · '+esc(prior.reps||'–')+' reps':'Sin registro anterior')+'</small><label class="row" style="margin:0"><input class="check" type="checkbox" '+(log.done?'checked':'')+' onchange="logEx(\''+id+'\',\'done\',this.checked)"> Hecho</label></div></div>'});if(!p.exercises.length)out+='<div class="card">Hoy toca recuperación. 💪</div>';return out}
function findPrevious(d,id,dt){return Object.keys(state.logs).filter(k=>k.endsWith('_'+d)&&k.slice(0,10)<dt&&state.logs[k][id]).sort().reverse().map(k=>state.logs[k][id])[0]}
function logEx(id,field,val){const key=date+'_'+day;state.logs[key] ||= {};state.logs[key][id] ||= {};state.logs[key][id][field]=val;save();if(field==='done'){if(val){setTimer(90);toggleTimer(true)}render()}}
function foodKey(){return date}
function foodTotals(){let t={kcal:0,protein:0,carbs:0,fat:0};(state.food[foodKey()]||[]).forEach(f=>{for(const k of Object.keys(t))t[k]+=Number(f[k])||0});return t}
function nutrition(){const t=foodTotals(),g=state.goals;let out='<div class="card"><h2>Nutrición diaria</h2><div class="muted">Objetivos orientativos y editables. Las comidas del plan NO cuentan como consumidas.</div><label>Fecha</label><input type="date" value="'+date+'" onchange="setDate(this.value)"><div class="grid2" style="margin-top:12px"><div class="stat"><b>'+Math.round(t.kcal)+'</b><div class="muted">/ '+g.kcal+' kcal</div></div><div class="stat"><b>'+Math.round(t.protein)+'</b><div class="muted">/ '+g.protein+' g proteína</div></div><div class="stat"><b>'+Math.round(t.carbs)+'</b><div class="muted">/ '+g.carbs+' g carbos</div></div><div class="stat"><b>'+Math.round(t.fat)+'</b><div class="muted">/ '+g.fat+' g grasas</div></div></div><div class="progress"><i style="width:'+Math.min(100,t.kcal/g.kcal*100)+'%"></i></div></div>';out+=dayNav()+'<div class="card"><h2>Menú sugerido · '+labels[days.indexOf(day)]+'</h2><div class="muted">Cantidades aproximadas. Pesos de arroz, pasta y patata cocidos; carnes y pescados crudos. No se asignan macros inventados a las sugerencias.</div>'+meals[day].map(m=>'<div class="meal"><b>'+m[0]+'</b><div class="muted">'+m[1]+'</div></div>').join('')+'</div>';out+='<div class="card"><h2>Registrar consumo real</h2><div class="muted">Ingresá los macros según etiqueta nutricional o una fuente confiable.</div><label>Alimento / comida</label><input id="f-name" placeholder="Ej. yogur 250 g"><div class="grid2"><div><label>kcal</label><input id="f-kcal" type="number" min="0" placeholder="0"></div><div><label>Proteína (g)</label><input id="f-protein" type="number" min="0" step=".1"></div><div><label>Carbohidratos (g)</label><input id="f-carbs" type="number" min="0" step=".1"></div><div><label>Grasas (g)</label><input id="f-fat" type="number" min="0" step=".1"></div></div><div class="spacer"></div><button class="btn primary" onclick="addFood()">+ Registrar alimento</button></div><div class="card"><h3>Consumido el '+date+'</h3>';const foods=state.food[foodKey()]||[];out+=foods.length?foods.map((f,i)=>'<div class="meal between"><div><b>'+esc(f.name)+'</b><div class="muted">'+f.kcal+' kcal · P '+f.protein+' · C '+f.carbs+' · G '+f.fat+'</div></div><button class="btn small" onclick="deleteFood('+i+')">Quitar</button></div>').join(''):'<div class="muted">Todavía no registraste alimentos.</div>';return out+'</div>'}
function addFood(){const name=document.getElementById('f-name').value.trim();if(!name)return alert('Ingresá un alimento');const f={name};for(const k of ['kcal','protein','carbs','fat']){const raw=document.getElementById('f-'+k).value;if(raw===''||Number(raw)<0||!Number.isFinite(Number(raw)))return alert('Completá los cuatro valores nutricionales');f[k]=Number(raw)}state.food[foodKey()] ||= [];state.food[foodKey()].push(f);save();render()}
function deleteFood(i){if(!confirm('¿Quitar este registro?'))return;state.food[foodKey()].splice(i,1);save();render()}
function progress(){let out='<div class="card"><h2>Progreso físico</h2><div class="muted">Registrá medidas reales. Usá la misma báscula y condiciones de medición.</div><label>Fecha</label><input type="date" id="m-date" value="'+date+'"><div class="grid2"><div><label>Peso corporal (kg)</label><input id="m-weight" type="number" step=".1" min="0" placeholder="83"></div><div><label>Cintura (cm)</label><input id="m-waist" type="number" step=".1" min="0" placeholder="Ej. 88"></div></div><div class="spacer"></div><button class="btn primary" onclick="addMeasure()">Guardar medición</button></div><div class="card"><h3>Historial</h3>';out+=(state.measures.length?state.measures.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(m=>'<div class="meal"><b>'+m.date+'</b><div class="muted">Peso: '+(m.weight||'–')+' kg · Cintura: '+(m.waist||'–')+' cm</div></div>').join(''):'<div class="muted">Sin mediciones todavía.</div>');return out+'</div>'}
function addMeasure(){const date=document.getElementById('m-date').value,weight=document.getElementById('m-weight').value,waist=document.getElementById('m-waist').value;if(!date||(!weight&&!waist))return alert('Indicá fecha y al menos una medida');if((weight&&Number(weight)<=0)||(waist&&Number(waist)<=0))return alert('Valores inválidos');state.measures.push({date,weight,waist});save();render()}
function settings(){const g=state.goals;return '<div class="card"><h2>Objetivos diarios</h2><div class="muted">Referencia inicial: 2450 kcal, 170 g proteína, 285 g carbohidratos y 70 g grasa.</div><div class="grid2">'+[['kcal','Calorías (kcal)'],['protein','Proteína (g)'],['carbs','Carbohidratos (g)'],['fat','Grasas (g)']].map(([k,l])=>'<div><label>'+l+'</label><input id="goal-'+k+'" type="number" min="1" value="'+g[k]+'"></div>').join('')+'</div><div class="spacer"></div><button class="btn primary" onclick="saveGoals()">Guardar objetivos</button></div><div class="card"><h2>Copias de seguridad</h2><div class="muted">El progreso se guarda en este navegador/dispositivo mediante localStorage. Borrar los datos del navegador puede eliminarlo. No hay sincronización en la nube.</div><div class="spacer"></div><button class="btn" onclick="exportData()">Exportar JSON</button><label>Importar copia JSON</label><input type="file" accept=".json,application/json" onchange="importData(this.files[0])"></div><div class="card"><h3>Rutina V1</h3><div class="muted">La V2 utiliza claves nuevas, sin borrar las claves anteriores de V1 si estaban en este mismo origen web. El sistema V1 original no guardaba un historial por fecha.</div></div>'}
function saveGoals(){for(const k of ['kcal','protein','carbs','fat']){const v=Number(document.getElementById('goal-'+k).value);if(!Number.isFinite(v)||v<=0)return alert('Revisá los objetivos');state.goals[k]=v}save();render()}
function exportData(){const b=new Blob([JSON.stringify({app:'lucas-pro-v2',exported:new Date().toISOString(),data:state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lucas-pro-backup-'+todayISO()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
async function importData(file){if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.app!=='lucas-pro-v2'||!obj.data||!obj.data.logs||!obj.data.food)throw Error('Archivo incompatible');if(!confirm('Esto reemplazará los datos V2 actuales. ¿Continuar?'))return;state=obj.data;save();render()}catch(e){alert('No se pudo importar: '+e.message)}}
function render(){tabs();document.getElementById('app').innerHTML=section==='entreno'?workout():section==='nutri'?nutrition():section==='progreso'?progress():settings();if(!storage.ok)document.getElementById('app').insertAdjacentHTML('afterbegin','<div class="hint">Almacenamiento no disponible: tus cambios podrían perderse al cerrar.</div>')}
let timerId=null,remaining=90,running=false;function updateClock(){document.getElementById('clock').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');document.getElementById('play').textContent=running?'⏸':'▶'}function setTimer(sec){clearInterval(timerId);running=false;remaining=sec;updateClock()}function toggleTimer(force=false){if(running&&!force){clearInterval(timerId);running=false;updateClock();return}clearInterval(timerId);running=true;updateClock();timerId=setInterval(()=>{if(remaining>0)remaining--;else{clearInterval(timerId);running=false}updateClock()},1000)}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();updateClock();
</script></body></html>
